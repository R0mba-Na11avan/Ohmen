name: Release

# Push a tag like v0.1.0 to build the installers and attach them to a draft
# GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that creates the draft release may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported runner: the frozen sidecar only
        # runs on systems with a glibc at least as new as the build machine's.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Freeze the sidecar
        run: |
          python -m pip install -r packaging/requirements.lock
          python -m pip install --no-deps .
          python -m PyInstaller packaging/sidecar.spec --noconfirm --distpath packaging/dist --workpath packaging/build
      - name: Check the frozen sidecar
        shell: bash
        run: packaging/dist/sidecar/ohmen-sidecar --selftest
      - name: Build installers
        run: |
          npm ci --prefix app
          npm run dist --prefix app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.rpm
            app/release/*.deb
          if-no-files-found: error
          # Only a hand-off to the release job; the release keeps the files.
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
