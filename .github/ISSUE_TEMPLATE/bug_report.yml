name: Bug report
description: Something in the app or the CLI doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with ...
        2. Click ...
  - type: input
    id: version
    attributes:
      label: Ohmen version
      description: Settings › About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Fedora 42 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: kicad
    attributes:
      label: KiCad version
      placeholder: "10.0.5"
  - type: input
    id: model
    attributes:
      label: Model in use (if relevant)
      placeholder: "claude:claude-sonnet-5, ollama qwen3, ..."
  - type: textarea
    id: log
    attributes:
      label: Sidecar log
      description: >-
        Settings › About shows where the log file is. Paste the relevant part.
        Check it doesn't contain anything private first.
      render: text
